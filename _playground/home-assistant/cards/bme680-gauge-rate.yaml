# BME680 Rate of Change Gauge Card (Right Gauge)
# Shows smoothed change rate with threshold and max rate
#
# Entity Mapping:
#   4. sensor.bme680_chanber_smoothed_change_rate (primary gauge value)
#   5. sensor.bme680_chanber_rate_change_plateau (threshold)
#   6. sensor.bme680_chanber_max_rate_since_soak_start (max rate)
#
# Layout:
#   [4 - Rate of Change - large at top center]
#   [Horizontal line separator]
#   < [5] │ Max: [6]
#   [Vertical line separator between left/right]

type: custom:flex-horseshoe-card
entities:
  # Primary entity - smoothed change rate (displayed in horseshoe gauge)
  - entity: sensor.bme680_chanber_smoothed_change_rate
    decimals: 2
    unit: '°C/min'
  # Threshold (plateau) for comparison
  - entity: sensor.bme680_chanber_rate_change_plateau
    decimals: 2
    unit: '°C/min'
  # Max rate since soak start
  - entity: sensor.bme680_chanber_max_rate_since_soak_start
    decimals: 2
    unit: '°C/min'

# Primary entity displayed in gauge
primary_entity: entity.0

# Gauge scale - dynamic from entities
horseshoe_scale:
  min: "{{ states('sensor.bme680_chanber_max_rate_since_soak_start') | float(0) }}"
  max: "{{ states('sensor.bme680_chanber_rate_change_plateau') | float(5) }}"

# Color stops for rate of change gauge
color_stops:
  '0': '#00FF00'   # Green (low rate)
  '2.5': '#FFFF00' # Yellow
  '5': '#FF0000'   # Red (high rate)

# Layout configuration - T-formation INSIDE gauge area
layout:
  states:
    # Primary value at top center (rate of change - entity 4)
    - id: 0
      entity_index: 0
      xpos: 50
      ypos: 30
      styles:
        - font-size: 3.5em
        - font-weight: bold
        - fill: '#E8E8E8'
        - text-anchor: middle
    
    # Label "<" for threshold status
    - id: 1
      xpos: 18
      ypos: 75
      styles:
        - font-size: 1.2em
        - fill: "{% if states('sensor.bme680_chanber_smoothed_change_rate') | float < states('sensor.bme680_chanber_rate_change_plateau') | float(0) %}#4CAF50{% else %}#F44336{% endif %}"
        - text-anchor: middle
      text: "<"
    
    # Threshold value (< 5) - left side below horizontal line (entity 5)
    - id: 2
      entity_index: 1
      xpos: 30
      ypos: 75
      styles:
        - font-size: 1.5em
        - font-weight: bold
        - fill: "{% if states('sensor.bme680_chanber_smoothed_change_rate') | float < states('sensor.bme680_chanber_rate_change_plateau') | float(0) %}#4CAF50{% else %}#F44336{% endif %}"
        - text-anchor: middle
    
    # Label "Max:" before max rate
    - id: 3
      xpos: 58
      ypos: 75
      styles:
        - font-size: 1.2em
        - fill: '#B0B0B0'
        - text-anchor: middle
      text: 'Max:'
    
    # Max rate (Max: 6) - right side below horizontal line (entity 6)
    - id: 4
      entity_index: 2
      xpos: 70
      ypos: 75
      styles:
        - font-size: 1.5em
        - font-weight: bold
        - fill: '#E8E8E8'
        - text-anchor: middle
  
  # Horizontal line separator (T-formation)
  hlines:
    - id: 0
      xpos: 20
      ypos: 65
      length: 60
      styles:
        - stroke: '#E8E8E8'
        - stroke-width: 1
        - opacity: 0.5
  
  # Vertical line separator (T-formation)
  vlines:
    - id: 0
      xpos: 50
      ypos: 65
      length: 15
      styles:
        - stroke: '#E8E8E8'
        - stroke-width: 1
        - opacity: 0.5

# Show configuration
show:
  horseshoe_style: lineargradient
  scale_tickmarks: true

# Dark theme styling
card_mod:
  style: |
    ha-card {
      background: #2C2C2C;
      color: #E8E8E8;
    }

